services:
  glm52-exl3-vision-v20:
    extends:
      file: docker-compose.exl3-v20.yml
      service: glm52-exl3-v20
    image: "${EXL3_IMAGE:-local/glm52-exl3-rc2-quality-runtime:20260725-v7-glm5v}"
    container_name: glm52-exl3-vision-v20-5001
    volumes:
      - ${EXL3_MODEL_PATH:?Set EXL3_MODEL_PATH to the absolute checkpoint directory}:/model:ro
      - glm52-exl3-vision-cache:/cache
    environment:
      EXL3_SERVED_MODEL_NAME: GLM-5.2-Vision
      EXL3_LIMIT_MM_PER_PROMPT: '{"image":4}'
      EXL3_INTERLEAVE_MM_STRINGS: "1"
      EXL3_MTP_TOKENS: "${EXL3_MTP_TOKENS:-0}"
      EXL3_KV_MODE: "${EXL3_KV_MODE:-profile}"
      EXL3_PREFIX_CACHING: "${EXL3_PREFIX_CACHING:-0}"
      EXL3_MAX_MODEL_LEN: "${EXL3_MAX_MODEL_LEN:-262144}"
      EXL3_MAX_NUM_SEQS: "${EXL3_MAX_NUM_SEQS:-4}"
      EXL3_MAX_BATCHED_TOKENS: "${EXL3_MAX_BATCHED_TOKENS:-4096}"
      EXL3_GPU_MEMORY_UTILIZATION: "${EXL3_GPU_MEMORY_UTILIZATION:-0.94}"
      EXL3_DCP_SIZE: "${EXL3_DCP_SIZE:-4}"
      EXL3_SPEC_EXTEND_AS_DECODE: "${EXL3_SPEC_EXTEND_AS_DECODE:-1}"

volumes:
  glm52-exl3-vision-cache:
