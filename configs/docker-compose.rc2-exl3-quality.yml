services:
  glm52-rc2-exl3-quality:
    extends:
      file: docker-compose.exl3-experiment.yml
      service: glm52-exl3-experiment
    image: "${EXL3_IMAGE:?set EXL3_IMAGE to a locally built RC2+EXL3 image}"
    container_name: glm52-rc2-exl3-quality-5001
    environment:
      VLLM_EXL3_TRELLIS_MIN_M: "1"
      VLLM_EXL3_PREFILL_TRELLIS: "1"
      VLLM_EXL3_PREFILL_BLOCK_M: "${EXL3_PREFILL_BLOCK_M:-64}"
      VLLM_EXL3_PREFILL_CHUNK: "${EXL3_PREFILL_CHUNK:-3}"
      SPARKINFER_INDEXER_TWO_LEVEL_FOLD: "${EXL3_INDEXER_TWO_LEVEL_FOLD:-auto}"
      SPARKINFER_INDEXER_TWO_LEVEL_FOLD_MAX_MIB: "${EXL3_INDEXER_TWO_LEVEL_FOLD_MAX_MIB:-256}"
      VLLM_B12X_MLA_SPEC_EXTEND_AS_DECODE: "${EXL3_SPEC_EXTEND_AS_DECODE:-1}"
      KV_FP8_ROPE: "${EXL3_KV_FP8_ROPE:-1}"
      VLLM_B12X_ABSORB_BMM: "${EXL3_B12X_ABSORB_BMM:-0}"
      EXL3_MTP_TOKENS: "${EXL3_MTP_TOKENS:-3}"
    command:
      - |
        set -euo pipefail
        unset NCCL_GRAPH_FILE NCCL_GRAPH_DUMP_FILE VLLM_B12X_MLA_EXTEND_MAX_CHUNKS
        mtp_tokens="$${EXL3_MTP_TOKENS}"
        case "$${mtp_tokens}" in
          1) graph_sizes='[2,4,6,8,10,12,14,16]'; max_capture=16; min_trellis_m=1 ;;
          2) graph_sizes='[3,6,9,12,15,18,21,24]'; max_capture=24; min_trellis_m=1 ;;
          3) graph_sizes='[4,8,12,16,20,24,28,32]'; max_capture=32; min_trellis_m=1 ;;
          4) graph_sizes='[5,10,15,20,25,30,35,40]'; max_capture=40; min_trellis_m=1 ;;
          5) graph_sizes='[6,12,18,24,30,36,42,48]'; max_capture=48; min_trellis_m=1 ;;
          *) echo "EXL3_MTP_TOKENS must be in [1,5], got $${mtp_tokens}" >&2; exit 2 ;;
        esac
        export VLLM_EXL3_TRELLIS_MIN_M="$${min_trellis_m}"
        exec vllm serve /model \
          --served-model-name GLM-5.2 \
          --host 0.0.0.0 --port 5001 --trust-remote-code \
          --tensor-parallel-size 4 \
          --decode-context-parallel-size "${EXL3_DCP_SIZE:-4}" \
          --dcp-comm-backend a2a \
          --dcp-kv-cache-interleave-size 1 \
          --seed 0 \
          --quantization exl3 \
          --kv-cache-dtype nvfp4_ds_mla \
          --attention-backend B12X_MLA_SPARSE \
          --moe-backend b12x \
          --load-format safetensors \
          --compilation-config "{\"cudagraph_mode\":\"FULL_AND_PIECEWISE\",\"cudagraph_capture_sizes\":$${graph_sizes},\"custom_ops\":[\"all\"],\"pass_config\":{\"fuse_allreduce_rms\":true}}" \
          --gpu-memory-utilization "${EXL3_GPU_MEMORY_UTILIZATION:-0.95}" \
          --max-model-len "${EXL3_MAX_MODEL_LEN:-999424}" \
          --max-num-seqs "${EXL3_MAX_NUM_SEQS:-8}" \
          --max-num-batched-tokens "${EXL3_MAX_BATCHED_TOKENS:-5120}" \
          --max-cudagraph-capture-size "$${max_capture}" \
          --num-gpu-blocks-override "${EXL3_GPU_BLOCKS:-3904}" \
          --enable-chunked-prefill \
          --enable-prefix-caching \
          --enable-auto-tool-choice \
          --tool-call-parser glm47 \
          --reasoning-parser glm45 \
          --default-chat-template-kwargs '{"reasoning_effort":"high"}' \
          --hf-overrides '{"use_index_cache":true,"index_topk_pattern":"FFFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSS"}' \
          --speculative-config "{\"method\":\"mtp\",\"num_speculative_tokens\":$${mtp_tokens},\"moe_backend\":\"${EXL3_DRAFT_MOE_BACKEND:-triton}\",\"draft_sample_method\":\"greedy\"}"

volumes:
  glm52-exl3-experiment-cache:
