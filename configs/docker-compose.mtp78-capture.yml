services:
  glm52-mtp78-capture:
    extends:
      file: docker-compose.exl3-experiment.yml
      service: glm52-exl3-experiment
    image: "${EXL3_IMAGE:?set EXL3_IMAGE to the candidate image}"
    container_name: glm52-mtp78-capture-5001
    volumes:
      - "${MTP_HOOK_DIR:?set MTP_HOOK_DIR to tools/mtp78/capture}:/mtp-hook:ro"
      - "${MTP_CAPTURE_DIR:-/dev/shm/glm52-mtp78-capture}:/mtp-capture"
    environment:
      PYTHONPATH: /mtp-hook
      VLLM_MTP_CAPTURE_DIR: /mtp-capture/layer_078
      VLLM_MTP_CAPTURE_MAX_TOKENS: "${MTP_CAPTURE_TOKENS:-131072}"
      VLLM_DCP_SHARD_DRAFT: "0"
      VLLM_B12X_MLA_SPEC_EXTEND_AS_DECODE: "1"
      KV_FP8_ROPE: "1"
      SPARKINFER_INDEXER_TWO_LEVEL_FOLD: auto
      SPARKINFER_INDEXER_TWO_LEVEL_FOLD_MAX_MIB: "256"
      EXL3_MTP_TOKENS: "3"
    command:
      - |
        set -euo pipefail
        unset NCCL_GRAPH_FILE NCCL_GRAPH_DUMP_FILE VLLM_B12X_MLA_EXTEND_MAX_CHUNKS
        exec vllm serve /model \
          --served-model-name GLM-5.2 \
          --host 0.0.0.0 --port 5001 --trust-remote-code \
          --tensor-parallel-size 4 \
          --decode-context-parallel-size "${MTP_CAPTURE_DCP_SIZE:-1}" \
          --dcp-comm-backend a2a \
          --dcp-kv-cache-interleave-size 1 \
          --seed 0 \
          --quantization exl3 \
          --kv-cache-dtype nvfp4_ds_mla \
          --attention-backend B12X_MLA_SPARSE \
          --moe-backend b12x \
          --load-format safetensors \
          --enforce-eager \
          --gpu-memory-utilization 0.95 \
          --max-model-len "${MTP_CAPTURE_MAX_MODEL_LEN:-16384}" \
          --max-num-seqs 8 \
          --max-num-batched-tokens 3072 \
          --enable-chunked-prefill \
          --enable-prefix-caching \
          --enable-auto-tool-choice \
          --tool-call-parser glm47 \
          --reasoning-parser glm45 \
          --default-chat-template-kwargs '{"reasoning_effort":"high"}' \
          --hf-overrides '{"use_index_cache":true,"index_topk_pattern":"FFFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSS"}' \
          --speculative-config '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton","draft_sample_method":"greedy"}'

volumes:
  glm52-exl3-experiment-cache:
